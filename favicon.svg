<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs><linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#9fd0ef"/><stop offset="1" stop-color="#d9eefa"/></linearGradient></defs>
  <rect width="64" height="64" rx="14" fill="url(#sky)"/>
  <svg x="0" y="13" width="64" height="38.4" viewBox="0 0 300 180">
  
  <defs>
    <filter id="cl-fluff" x="-20%" y="-30%" width="140%" height="160%">
      <feTurbulence type="fractalNoise" baseFrequency=".032" numOctaves="4" seed="7" result="noise"/>
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="22" xChannelSelector="R" yChannelSelector="G" result="d"/>
      <feGaussianBlur in="d" stdDeviation="2.6"/>
    </filter>
    <filter id="cl-soft" x="-30%" y="-30%" width="160%" height="160%">
      <feTurbulence type="fractalNoise" baseFrequency=".05" numOctaves="3" seed="11" result="noise"/>
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="14" xChannelSelector="R" yChannelSelector="G" result="d"/>
      <feGaussianBlur in="d" stdDeviation="6"/>
    </filter>
    <radialGradient id="cl-body" cx="48%" cy="22%" r="80%">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset=".5" stop-color="#f6f8fb"/>
      <stop offset="1" stop-color="#dfe6ef"/>
    </radialGradient>
    <linearGradient id="cl-belly" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e9eef5" stop-opacity="0"/>
      <stop offset="1" stop-color="#b7c6d8" stop-opacity=".85"/>
    </linearGradient>
  </defs>

  
  <g filter="url(#cl-fluff)" fill="url(#cl-body)">
    <ellipse cx="150" cy="128" rx="118" ry="28"/>
    <circle cx="62" cy="116" r="30"/>
    <circle cx="96" cy="92" r="40"/>
    <circle cx="142" cy="70" r="50"/>
    <circle cx="192" cy="84" r="42"/>
    <circle cx="232" cy="108" r="32"/>
    <circle cx="120" cy="118" r="36"/>
    <circle cx="176" cy="120" r="34"/>
    <circle cx="258" cy="128" r="20"/>
    <circle cx="40" cy="132" r="18"/>
  </g>

  
  <g filter="url(#cl-soft)" fill="url(#cl-belly)">
    <ellipse cx="150" cy="134" rx="112" ry="22"/>
  </g>

  
  <g filter="url(#cl-soft)" fill="#ffffff" opacity=".95">
    <circle cx="94" cy="80" r="20"/>
    <circle cx="140" cy="56" r="26"/>
    <circle cx="188" cy="72" r="18"/>
    <circle cx="228" cy="100" r="12"/>
  </g>
</svg>
</svg>