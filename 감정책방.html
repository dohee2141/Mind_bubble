    if (log) track("rule", input, found.map((f) => f.emotion), books);
  }
  var samplePromise = null;
  function getSample() {
    const w = window;
    if (!samplePromise) samplePromise = (w.claude ? w.claude.use("sample") : Promise.resolve(null)).catch(() => null);
    return samplePromise;
  }
  var aiOff = false;
  var catalog = () => BOOKS.map(
    (b) => `${b.id} | 『${b.title}』 ${b.author} | 이런 마음일 때: ${b.mood} | 키워드: ${b.keywords.join(", ")}`
  ).join("\n");
  function buildPrompt(input) {
    const out = lang === "en" ? "emotion, secondary, why, read 는 모두 자연스러운 영어로 쓴다(emotion은 1~3단어 소문자)." : "emotion은 짧은 한국어 명사(1~6자), why와 read는 한국어 해요체로 쓴다.";
    return `너는 독서 큐레이터다. 사용자가 지금 마음을 한 문장으로 적었다(한국어 또는 영어). 문장 전체의 뜻을 읽고 감정을 판단한 뒤, 아래 책 목록에서만 책 3권을 골라라.

규칙:
- ${out}
- emotion: 가장 강한 감정 하나. secondary: 함께 느껴지는 감정 최대 2개, 없으면 빈 배열.
- 부정 표현("안 ~해", "~지 않아", "~한 건 아닌데", "not ~")이 붙은 감정은 제외한다.
- books: 반드시 아래 목록의 id로만, 서로 다른 책 3권. 목록에 없는 책은 고르지 않는다.
- why: 사용자의 문장을 직접 반영한 한 문장(60자/100 characters 이내). 책 줄거리를 지어내지 말고 감정과의 연결만 말한다.
- read: 사용자의 마음을 다정하게 짚어 주는 한 문장.
- 감정 표현이 전혀 없으면 emotion을 null, books를 빈 배열로 한다.

책 목록:
${catalog()}

JSON 하나만 답한다:
{"emotion":"감정 또는 null","secondary":["감정"],"read":"한 문장","books":[{"id":"책 id","why":"이유"}]}

사용자 문장: """${input.slice(0, 300)}"""`;
  }
  var STOP_CODES = ["not_granted", "sampling_disabled", "not_declared", "capability_disabled", "capability_removed", "ai_disabled", "daily_limit"];
  var errText = (code) => {
    const k = `err_${code}`;
    return k in I18N.ko ? t(k) : t("err_other");
  };
  var strList = (v, n) => (Array.isArray(v) ? v : []).filter((x) => typeof x === "string" && x.trim() !== "").slice(0, n);
  var goRuleHTML = () => `<div class="chips"><button type="button" class="chip" data-go="rule">${esc(t("goRule"))}</button></div>`;
  async function aiRespond(raw, log = false) {
    const input = raw.trim();
    if (!input || aiOff) return;
    const out = $("#out-ai");
    const btn = $("#b-ai");
    out.innerHTML = `<p class="thinking">${esc(t("thinking"))}</p>`;
    btn.disabled = true;
    const sample = await getSample();
    if (!sample && !cloud.enabled) {
      out.innerHTML = `<div class="soft"><p>${esc(t("noAi"))}</p>${goRuleHTML()}</div>`;
      btn.disabled = false;
      return;
    }
    try {
      const res = sample ? await sample.json(buildPrompt(input), { modelTier: "quick" }) : await cloud.ai(input.slice(0, 300), lang);
      const emotion = typeof res?.emotion === "string" && res.emotion.trim() && res.emotion.trim() !== "null" ? res.emotion.trim().slice(0, 24) : null;
      const secondary = strList(res?.secondary, 2).filter((s) => s !== emotion);
      const read = typeof res?.read === "string" ? res.read : "";
      if (!emotion) {
        const books = defaults().map((book) => ({ book, why: book.note }));
        out.innerHTML = `<div class="soft"><p>${esc(t("noEmotion"))}</p></div><p class="mood">${esc(t("howAbout"))}</p>` + cardsHTML(books);
        if (log) track("ai", input, [], books);
      } else {
        const picked = [];
        for (const b of Array.isArray(res?.books) ? res.books : []) {
          const item = b ?? {};
          const book = BOOKS.find((x) => x.id === String(item.id ?? "").trim());
          if (book && !picked.some((p) => p.book.id === book.id) && picked.length < 3)
            picked.push({ book, why: String(item.why ?? "").slice(0, 160) || book.note });
        }
        for (const r of recommendByKeyword([emotion, ...secondary].join(" "), 6).recommendations) {
          if (picked.length < 3 && !picked.some((p) => p.book.id === r.book.id)) picked.push({ book: r.book, why: r.book.note });
        }
        out.innerHTML = moodHTML(esc(emotion) + (secondary.length ? ", " + secondary.map(esc).join(", ") : "")) + (read ? `<p class="read">${esc(read)}</p>` : "") + cardsHTML(picked);
        if (log) track("ai", input, [emotion, ...secondary], picked);
      }
    } catch (e) {
      const code = e?.code ?? "";
      const stop = STOP_CODES.includes(code);
      out.innerHTML = `<div class="soft"><p>${esc(errText(code))}</p>${stop ? goRuleHTML() : ""}</div>`;
      if (stop) {
        aiOff = true;
        $("#q-ai").disabled = true;
        return;
      }
    }
    btn.disabled = false;
  }
  function applyLang() {
    document.documentElement.lang = lang;
    document.title = t("docTitle");
    document.querySelectorAll("[data-i18n]").forEach((el) => {
      const v = t(el.dataset.i18n);
      el.textContent = v;
      if (el.classList.contains("hint")) el.hidden = !v;
    });
    document.querySelectorAll("[data-i18n-ph]").forEach((el) => {
      el.placeholder = t(el.dataset.i18nPh);
    });
    document.querySelectorAll("[data-lang]").forEach((b) => {
      b.setAttribute("aria-pressed", String(b.dataset.lang === lang));
    });
    $("#pick-rule").innerHTML = FEELINGS.map(
      (f) => `<button type="button" class="feel" data-q="${esc(f.name)}" aria-pressed="${f.name === picked}"><span class="fe" aria-hidden="true">${f.emoji}</span>${esc(emo(f.name))}</button>`
    ).join("");
    $("#chips-rule").innerHTML =`<span class="lbl">${esc(t("tryThis"))}</span>` + chipsHTML(EXAMPLES_KO.map((q) => ({ label: q, q })));
    $("#chips-ai").innerHTML = `<span class="lbl">${esc(t("tryThis"))}</span>` + chipsHTML((lang === "en" ? EXAMPLES_EN : EXAMPLES_KO).map((q) => ({ label: q, q })));
    if (cloud.enabled && !window.claude) $('#p-ai .hint').textContent = t("hintAiCloud");
    renderStars();
    if (lastRule) ruleRespond(lastRule);
    $("#out-ai").innerHTML = "";
    if (bgm) bgmLabel();
    if (themeBtn) themeLabel();
  }
  document.querySelectorAll("[data-lang]").forEach(
    (b) => b.addEventListener("click", () => {
      lang = b.dataset.lang === "en" ? "en" : "ko";
      try {
        localStorage.setItem("mb-lang", lang);
      } catch {
      }
      applyLang();
    })
  );
  for (const [form, q, count, fn] of [
    ["#f-rule", "#q-rule", "#c-rule", ruleRespond],
    ["#f-ai", "#q-ai", "#c-ai", aiRespond]
  ]) {
    const ta = $(q);
    ta.addEventListener("input", () => $(count).textContent = `${ta.value.length}/300`);
    ta.addEventListener("keydown", (e) => {
      if (e.key === "Enter" && !e.shiftKey && !e.isComposing) {
        e.preventDefault();
        $(form).requestSubmit();
      }
    });
    $(form).addEventListener("submit", (e) => {
      e.preventDefault();
      if (fn === aiRespond && $("#b-ai").disabled) return;
      fn(ta.value, true);
    });
  }
  function fillAndRun(panel, text, log = false) {
    const ta = $(`#q-${panel}`);
    ta.value = text;
    $(`#c-${panel}`).textContent = `${text.length}/300`;
    if (panel === "rule") ruleRespond(text, log);
    else if (!$("#b-ai").disabled) aiRespond(text, log);
  }
  for (const panel of ["rule", "ai"]) {
    $(`#p-${panel}`).addEventListener("click", (e) => {
      const el = e.target;
      if (el.closest("button[data-go]")) {
        location.hash = "rule";
        show("rule");
        return;
      }
      const b = el.closest("button[data-q]");
      if (b) fillAndRun(panel, b.dataset.q ?? "", true);
    });
  }
  function setPicked(name) {
    picked = name;
    document.querySelectorAll("#pick-rule .feel").forEach((b) => b.setAttribute("aria-pressed", String(b.dataset.q === name)));
  }
  $("#pick-rule").addEventListener("click", (e) => {
    const b = e.target.closest("button.feel");
    if (b) setPicked(b.dataset.q ?? "");
  });
  $("#q-rule").addEventListener("input", () => setPicked(""));
  $("#chips-rule").addEventListener("click", (e) => {
    if (e.target.closest("button[data-q]")) setPicked("");
  });
  var TABS = {
    rule: [$("#t-rule"), $("#p-rule")],
    ai: [$("#t-ai"), $("#p-ai")]
  };
  function show(name) {
    if (!TABS[name]) name = "rule";
    for (const [k, [tab, p]] of Object.entries(TABS)) {
      const on = k === name;
      tab.setAttribute("aria-selected", String(on));
      tab.tabIndex = on ? 0 : -1;
      p.hidden = !on;
    }
  }
  for (const k of Object.keys(TABS)) {
    TABS[k][0].addEventListener("click", () => {
      location.hash = k;
      show(k);
    });
  }
  $("[role=tablist]").addEventListener("keydown", (e) => {
    if (e.key !== "ArrowRight" && e.key !== "ArrowLeft") return;
    const next = TABS.rule[0].getAttribute("aria-selected") === "true" ? "ai" : "rule";
    location.hash = next;
    show(next);
    TABS[next][0].focus();
  });
  addEventListener("hashchange", () => show(location.hash.slice(1)));
  // 피드백 (Supabase 연결 시에만 보여요)
  var rating = 0;
  function renderStars() {
    const box = $("#fb-stars");
    box.querySelectorAll("label").forEach((l) => l.remove());
    for (let i = 1; i <= 5; i++) {
      const l = document.createElement("label");
      l.className = i <= rating ? "on" : "";
      l.innerHTML = `<input type="radio" name="fb-r" value="${i}"${i === rating ? " checked" : ""}><span aria-hidden="true">★</span>`;
      l.title = lang === "en" ? `${i} / 5` : `${i}점`;
      l.querySelector("input").setAttribute("aria-label", l.title);
      box.append(l);
    }
  }
  $("#fb-stars").addEventListener("change", (e) => {
    rating = Number(e.target.value) || 0;
    $("#fb-stars").querySelectorAll("label").forEach((l, i) => l.classList.toggle("on", i < rating));
  });
  $("#fb").addEventListener("submit", async (e) => {
    e.preventDefault();
    const msg = $("#fb-msg").value.trim();
    const outEl = $("#fb-out");
    if (!rating && !msg) {
      outEl.textContent = t("fbEmpty");
      return;
    }
    const btn = $("#fb button[type=submit]");
    btn.disabled = true;
    const ok = await cloud.feedback({ rating, message: msg, lang });
    btn.disabled = false;
    outEl.textContent = ok ? t("fbThanks") : t("fbFail");
    if (ok) {
      rating = 0;
      $("#fb-msg").value = "";
      renderStars();
    }
  });
  if (cloud.enabled) {
    $("#fb").hidden = false;
    $("#privacy").hidden = false;
  }

  show(location.hash.slice(1));

  // 버전2: BGM (자동재생 시도 → 브라우저가 막으면 첫 클릭·키 입력 때 시작, 끄면 다음 방문에도 꺼진 채로)
  // 버전2: 밝은/다크 모드 버튼 (누르면 반대 모드로, 선택은 다음 방문에도 기억)
  var themeBtn = $("#theme-toggle");
  var darkMQ = matchMedia("(prefers-color-scheme: dark)");
  function isDarkNow() {
    const th = document.documentElement.dataset.theme;
    return th === "dark" || (th !== "light" && darkMQ.matches);
  }
  function themeLabel() {
    const d = isDarkNow();
    const label = t(d ? "toLight" : "toDark");
    themeBtn.dataset.mode = d ? "dark" : "light";
    themeBtn.setAttribute("aria-label", label);
    themeBtn.title = label;
  }
  themeBtn.addEventListener("click", () => {
    const next = isDarkNow() ? "light" : "dark";
    document.documentElement.dataset.theme = next;
    try {
      localStorage.setItem("mb-theme", next);
    } catch {
    }
    themeLabel();
  });
  darkMQ.addEventListener("change", themeLabel);

  var bgm = $("#bgm-audio");
  var bgmBtn = $("#bgm-toggle");
  bgm.volume = 0.15;
  var bgmWanted = true;
  try {
    if (localStorage.getItem("mb-bgm") === "off") bgmWanted = false;
  } catch {
  }
  function bgmLabel() {
    const on = !bgm.paused;
    bgmBtn.setAttribute("aria-pressed", String(on));
    bgmBtn.querySelector("[data-bgm]").textContent = t(on ? "bgmOff" : "bgmOn");
  }
  function bgmSave(v) {
    try {
      localStorage.setItem("mb-bgm", v);
    } catch {
    }
  }
  var bgmPlay = () => bgm.play().catch(() => {
  });
  bgm.addEventListener("play", bgmLabel);
  bgm.addEventListener("pause", bgmLabel);
  bgmBtn.addEventListener("click", () => {
    bgmUnkick();
    if (bgm.paused) {
      bgmWanted = true;
      bgmSave("on");
      bgmPlay();
    } else {
      bgmWanted = false;
      bgmSave("off");
      bgm.pause();
    }
  });
  var KICK = ["pointerdown", "keydown"];
  function bgmKick(e) {
    if (e.target instanceof Element && e.target.closest("#bgm-toggle")) return;
    bgmUnkick();
    if (bgmWanted && bgm.paused) bgmPlay();
  }
  function bgmUnkick() {
    KICK.forEach((n) => removeEventListener(n, bgmKick, true));
  }
  if (bgmWanted) {
    KICK.forEach((n) => addEventListener(n, bgmKick, true));
    bgmPlay().then(() => {
      if (!bgm.paused) bgmUnkick();
    });
  }

  applyLang();
  fillAndRun("rule", EXAMPLES_KO[0]);
  cloud.visit(lang);

  // 관리자 페이지에서 고친 책 목록을 불러와요 (실패하면 기본 목록 그대로)
  if (cloud.enabled) {
    cloud.books().then((rows) => {
      if (!rows) return;
      const fresh = rows.map((r) => ({
        id: r.id, title: r.title, author: r.author, category: r.category, mood: r.mood, note: r.note,
        keywords: Array.isArray(r.keywords) ? r.keywords : [], emoji: r.emoji || "📘", cover_url: r.cover_url || ""
      }));
      BOOKS.length = 0;
      BOOKS.push(...fresh);
      if (lastRule) ruleRespond(lastRule);
    });
  }
})();

</script>
<script>
// 버전2: 푸른 윤슬 강물 배경 — 사진 없이 코드로 직접 그려서 저작권 걱정이 없어요.
// 물빛 그라데이션 + 천천히 흐르는 물결 + 햇빛이 부서지는 반짝임(윤슬).
// 움직임 줄이기 설정이면 멈춘 한 장면만 그리고, 탭이 안 보일 때는 쉬어요.
(() => {
  "use strict";
  const c = document.getElementById("river");
  if (!c || !c.getContext) return;
  const ctx = c.getContext("2d");
  const root = document.documentElement;
  const darkQ = matchMedia("(prefers-color-scheme: dark)");
  const calmQ = matchMedia("(prefers-reduced-motion: reduce)");
  const isDark = () => root.dataset.theme === "dark" || (root.dataset.theme !== "light" && darkQ.matches);
  let W = 0, H = 0, glints = [], raf = 0, last = 0;

  function seed() {
    const n = Math.min(320, Math.round((W * H) / 5000));
    glints = Array.from({ length: n }, () => ({
      x: Math.random() * W,
      y: Math.pow(Math.random(), 0.8) * H,
      len: 3 + Math.random() * 14,
      ph: Math.random() * Math.PI * 2,
      sp: 0.5 + Math.random() * 1.5,
      drift: 4 + Math.random() * 12
    }));
  }
  function resize() {
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    W = innerWidth; H = innerHeight;
    c.width = Math.round(W * dpr); c.height = Math.round(H * dpr);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    seed();
  }
  function draw(t) {
    const d = isDark();
    const g = ctx.createLinearGradient(0, 0, 0, H);
    if (d) { g.addColorStop(0, "#0a1b2c"); g.addColorStop(0.5, "#11314d"); g.addColorStop(1, "#1a4567"); }
    else { g.addColorStop(0, "#e6f4fc"); g.addColorStop(0.45, "#c2e3f5"); g.addColorStop(1, "#93c8e8"); }
    ctx.globalCompositeOperation = "source-over";
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, W, H);

    // 천천히 흐르는 물결 띠
    ctx.lineCap = "round";
    for (let k = 0; k < 7; k++) {
      const y0 = H * (0.08 + k * 0.14);
      const amp = 4 + k * 1.2, wl = 180 + k * 40, ph = t * 0.00025 * (1 + k * 0.15) + k;
      ctx.beginPath();
      for (let x = -20; x <= W + 20; x += 12) {
        const y = y0 + Math.sin(x / wl * Math.PI * 2 + ph) * amp + Math.sin(x / (wl * 0.37) - ph * 1.7) * amp * 0.35;
        x === -20 ? ctx.moveTo(x, y) : ctx.lineTo(x, y);
      }
      ctx.strokeStyle = d ? "rgba(140,190,235,0.07)" : "rgba(255,255,255,0.22)";
      ctx.lineWidth = 10 + k * 2;
      ctx.stroke();
    }

    // 윤슬: 반짝였다 사라지는 가로로 긴 빛 조각
    ctx.globalCompositeOperation = "lighter";
    for (const s of glints) {
      const b = Math.pow(Math.max(0, Math.sin(t * 0.0012 * s.sp + s.ph)), 6);
      if (b < 0.02) continue;
      const x = (s.x + (t / 1000) * s.drift) % (W + 40) - 20;
      const y = s.y + Math.sin(t * 0.0008 + s.ph) * 2;
      const r = s.len * (0.6 + b * 0.6);
      const a = (d ? 0.75 : 0.9) * b;
      const rg = ctx.createRadialGradient(x, y, 0, x, y, r);
      rg.addColorStop(0, `rgba(255,255,255,${a})`);
      rg.addColorStop(0.35, d ? `rgba(190,225,255,${a * 0.5})` : `rgba(235,248,255,${a * 0.55})`);
      rg.addColorStop(1, "rgba(255,255,255,0)");
      ctx.fillStyle = rg;
      ctx.beginPath();
      ctx.ellipse(x, y, r, r * 0.28, 0, 0, Math.PI * 2);
      ctx.fill();
      if (b > 0.85) { // 가장 밝은 순간엔 작은 별빛
        ctx.fillStyle = `rgba(255,255,255,${(b - 0.85) * 4})`;
        ctx.fillRect(x - 0.5, y - r * 0.5, 1, r);
        ctx.fillRect(x - r * 0.5, y - 0.5, r, 1);
      }
    }
    ctx.globalCompositeOperation = "source-over";
  }
  function loop(t) {
    raf = requestAnimationFrame(loop);
    if (t - last < 33) return; // 약 30fps
    last = t;
    draw(t);
  }
  function start() {
    cancelAnimationFrame(raf);
    if (calmQ.matches) { draw(4000); return; }
    if (!document.hidden) raf = requestAnimationFrame(loop);
  }
  addEventListener("resize", () => { resize(); if (calmQ.matches) draw(4000); });
  document.addEventListener("visibilitychange", start);
  calmQ.addEventListener("change", start);
  darkQ.addEventListener("change", () => draw(performance.now()));
  resize();
  start();
})();
</script>
