<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"></head><body><title>마음버블서점</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gowun+Dodum&family=Noto+Sans+KR:wght@400;500;700&display=swap">
<style>
/* Layout: one calm column — bubble header, two soft tabs, one input card, latest result only */
:root{
  --bg:#fdf8f5; --surface:#ffffff; --ink:#3a302d; --muted:#8a7d78; --line:#f0e4de;
  --accent:#d9718f; --accent-ink:#ffffff; --accent-soft:#fbe6ec; --ai:#8c78c9; --ai-soft:#efeafa;
  --warn-soft:#fdf1e3;
  --display:"Gowun Dodum","Noto Sans KR",system-ui,sans-serif;
  --sans:"Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  --r:18px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#1e1a1a; --surface:#292323; --ink:#f2e9e6; --muted:#b4a6a1; --line:#3b3231;
  --accent:#ee9ab2; --accent-ink:#2a1a1f; --accent-soft:#45282f; --ai:#b9a8ec; --ai-soft:#2f2a40;
  --warn-soft:#3a2f22; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#1e1a1a; --surface:#292323; --ink:#f2e9e6; --muted:#b4a6a1; --line:#3b3231;
  --accent:#ee9ab2; --accent-ink:#2a1a1f; --accent-soft:#45282f; --ai:#b9a8ec; --ai-soft:#2f2a40;
  --warn-soft:#3a2f22; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.65;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:36px 56px}
main{max-width:640px;margin:0 auto;display:flex;flex-direction:column;gap:22px}
.lang{align-self:flex-end;display:flex;gap:2px;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:3px;margin-bottom:-8px}
.lang button{border:0;background:transparent;color:var(--muted);font:inherit;font-size:.8rem;padding:3px 12px;border-radius:999px;cursor:pointer}
.lang button[aria-pressed=true]{background:var(--accent-soft);color:var(--accent);font-weight:500}
header{text-align:center;display:flex;flex-direction:column;gap:4px;align-items:center}
.bubble{font-size:2.2rem;line-height:1}
h1{font-family:var(--display);font-size:1.7rem;font-weight:400;margin:0}
header p{margin:0;color:var(--muted)}

[role=tablist]{display:grid;grid-template-columns:1fr 1fr;gap:6px;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:5px}
[role=tab]{appearance:none;border:0;background:transparent;color:var(--muted);font:inherit;font-weight:500;padding:8px 10px;border-radius:999px;cursor:pointer}
[role=tab][aria-selected=true]#t-rule{background:var(--accent-soft);color:var(--accent)}
[role=tab][aria-selected=true]#t-ai{background:var(--ai-soft);color:var(--ai)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
[role=tabpanel]{display:flex;flex-direction:column;gap:14px}
[role=tabpanel][hidden]{display:none}

form{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;display:flex;flex-direction:column;gap:10px}
form label{font-family:var(--display);font-size:1.05rem}
textarea{width:100%;min-height:76px;resize:vertical;border:1px solid var(--line);border-radius:12px;background:var(--bg);color:var(--ink);font:inherit;padding:10px 12px}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.count{font-size:.8rem;color:var(--muted);font-variant-numeric:tabular-nums}
form button{border:0;border-radius:999px;padding:9px 20px;font:inherit;font-weight:500;cursor:pointer;color:var(--accent-ink);background:var(--accent)}
#p-ai form button{background:var(--ai)}
form button:disabled{opacity:.5;cursor:default}
.hint{margin:0;font-size:.82rem;color:var(--muted)}

.chips{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.chips .lbl{font-size:.82rem;color:var(--muted);margin-right:2px}
.chip{border:1px solid var(--line);background:var(--surface);color:var(--ink);font:inherit;font-size:.86rem;padding:4px 12px;border-radius:999px;cursor:pointer}
.chip:hover{border-color:var(--accent)}

.result{display:flex;flex-direction:column;gap:12px}
.result:empty{display:none}
.mood{font-family:var(--display);font-size:1.1rem;margin:0}
.mood b{font-weight:400;color:var(--accent)}
#p-ai .mood b{color:var(--ai)}
.read{margin:0;background:var(--ai-soft);border-radius:12px;padding:10px 14px}
.soft{margin:0;background:var(--warn-soft);border-radius:12px;padding:12px 14px;display:flex;flex-direction:column;gap:10px}
.soft p{margin:0}
.thinking{margin:0;color:var(--ai);font-family:var(--display);font-size:1.05rem}
.books{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:10px}
.books li{display:flex;gap:14px;align-items:flex-start;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px}
.books .em{font-size:1.6rem;line-height:1.3;width:44px;height:44px;display:grid;place-items:center;border-radius:50%;background:var(--accent-soft);flex-shrink:0}
#p-ai .books .em{background:var(--ai-soft)}
.books .bk{min-width:0}
.books .t{font-weight:700}
.books .a{color:var(--muted);font-size:.85rem}
.books .w{margin-top:4px;font-size:.93rem}
@media (prefers-reduced-motion:no-preference){.result>*{animation:rise .3s ease both}@keyframes rise{from{opacity:0;transform:translateY(6px)}}}
</style>

<main>
  <div class="lang" role="group" aria-label="언어 / Language">
    <button type="button" data-lang="ko" aria-pressed="true">한국어</button>
    <button type="button" data-lang="en" aria-pressed="false">English</button>
  </div>

  <header>
    <span class="bubble" aria-hidden="true">🫧</span>
    <h1 data-i18n="title">마음버블서점</h1>
    <p data-i18n="sub">오늘 마음에 맞는 책 세 권을 골라 드려요</p>
  </header>

  <nav role="tablist" aria-label="찾는 방식">
    <button role="tab" id="t-rule" aria-controls="p-rule" aria-selected="true" data-i18n="tabRule">마음 단어로 찾기</button>
    <button role="tab" id="t-ai" aria-controls="p-ai" aria-selected="false" tabindex="-1" data-i18n="tabAi">AI에게 물어보기</button>
  </nav>

  <section role="tabpanel" id="p-rule" aria-labelledby="t-rule">
    <form id="f-rule">
      <label for="q-rule" data-i18n="ask">오늘 마음을 한 문장으로 적어 주세요</label>
      <textarea id="q-rule" maxlength="300" placeholder="예: 발표 앞두고 불안해" data-i18n-ph="phRule"></textarea>
      <div class="row"><span class="count" id="c-rule">0/300</span><button type="submit" data-i18n="submit">책 추천받기</button></div>
      <p class="hint" data-i18n="hintRule" hidden></p>
    </form>
    <div class="chips" id="chips-rule"></div>
    <div class="result" id="out-rule" aria-live="polite"></div>
  </section>

  <section role="tabpanel" id="p-ai" aria-labelledby="t-ai" hidden>
    <form id="f-ai">
      <label for="q-ai" data-i18n="ask">오늘 마음을 한 문장으로 적어 주세요</label>
      <textarea id="q-ai" maxlength="300" placeholder="예: 불안한 건 아닌데 마음이 허해" data-i18n-ph="phAi"></textarea>
      <div class="row"><span class="count" id="c-ai">0/300</span><button type="submit" id="b-ai" data-i18n="submit">책 추천받기</button></div>
      <p class="hint" data-i18n="hintAi">감정 단어가 없어도 괜찮아요. 처음 한 번은 Claude 사용 허용 창이 떠요.</p>
    </form>
    <div class="chips" id="chips-ai"></div>
    <div class="result" id="out-ai" aria-live="polite"></div>
  </section>
</main>

<script>
"use strict";
(() => {
  // prototype/emotion-cards/recommend.ts
  var BOOKS = [
    // 💼 일 & 학업
    { id: "atomic-habits", title: "아주 작은 습관의 힘", author: "제임스 클리어", category: "work", mood: "해야 할 일이 너무 커 보여서 시작이 안 될 때", note: "거창한 결심 대신 1%짜리 작은 변화부터. 부담을 잘게 쪼개는 법을 알려줘요.", keywords: ["막막함", "미루기", "게으름", "의욕", "자책", "부담"], emoji: "🧱" },
    { id: "deep-work", title: "딥 워크", author: "칼 뉴포트", category: "work", mood: "하루 종일 바빴는데 한 게 없는 것 같을 때", note: "알림과 산만함에서 벗어나 정말 중요한 일에 집중하는 시간을 되찾게 해줘요.", keywords: ["산만함", "집중", "조급함", "허무", "바쁨"], emoji: "🎯" },
    { id: "hamatomyeon", title: "하마터면 열심히 살 뻔했다", author: "하완", category: "work", mood: "열심히 사는데도 늘 뒤처지는 기분일 때", note: '"꼭 그렇게까지 해야 하나?" 하고 한숨 돌리게 해주는 유쾌한 에세이예요.', keywords: ["뒤처짐", "비교", "압박", "조급함", "지침", "회의감"], emoji: "🛋️" },
    { id: "joy-and-sorrow-of-work", title: "일의 기쁨과 슬픔", author: "장류진", category: "work", mood: "회사에서 내 자리가 작게만 느껴질 때", note: '직장인의 하루를 담담하고 재치 있게 그린 소설집. "나만 이런 게 아니구나" 하고 웃게 돼요.', keywords: ["회사", "직장", "억울함", "현타", "씁쓸함", "공감"], emoji: "🏢" },
    { id: "essentialism", title: "에센셜리즘", author: "그렉 맥커운", category: "work", mood: "부탁을 거절 못 해서 할 일이 산더미일 때", note: "모든 걸 다 하려는 대신 정말 중요한 몇 가지만 고르는 연습. 마음의 짐이 가벼워져요.", keywords: ["과부하", "거절", "벅참", "압박", "정리", "부담"], emoji: "✂️" },
    { id: "grit", title: "그릿", author: "앤절라 더크워스", category: "work", mood: "재능이 없는 것 같아 포기하고 싶을 때", note: "타고난 재능보다 꾸준함이 더 멀리 간다는 이야기. 시험·공부에 지친 날 다시 힘을 줘요.", keywords: ["포기", "좌절", "시험", "열등감", "실패", "자신감"], emoji: "🌱" },
    // 👥 인간관계
    { id: "courage-to-be-disliked", title: "미움받을 용기", author: "기시미 이치로 · 고가 후미타케", category: "people", mood: "남들의 시선과 기대가 너무 신경 쓰일 때", note: "타인의 과제와 나의 과제를 나누는 법. 관계의 무게를 덜어줘요.", keywords: ["눈치", "시선", "인정욕구", "미움", "부담", "자존감"], emoji: "🕊️" },
    { id: "i-decided-to-live-as-me", title: "나는 나로 살기로 했다", author: "김수현", category: "people", mood: "누구에게도 맞추느라 내가 사라진 것 같을 때", note: "남의 기준이 아닌 나의 기준으로 살아도 괜찮다고 다정하게 말해줘요.", keywords: ["자존감", "눈치", "비교", "상처", "위축", "자기혐오"], emoji: "🌷" },
    { id: "you-are-right", title: "당신이 옳다", author: "정혜신", category: "people", mood: "누군가에게 온전히 이해받고 싶을 때", note: "충고보다 공감이 사람을 살린다는 이야기. 나와 주변을 대하는 법이 달라져요.", keywords: ["서운함", "공감", "이해", "상처", "외로움", "위로"], emoji: "🤝" },
    { id: "almond", title: "아몬드", author: "손원평", category: "people", mood: "마음을 표현하는 게 서툴러 외로울 때", note: "감정을 잘 느끼지 못하는 소년이 사람을 통해 변해가는 따뜻한 소설이에요.", keywords: ["외로움", "고립", "표현", "서툼", "공허"], emoji: "🌰" },
    { id: "reading-relationships", title: "관계를 읽는 시간", author: "문요한", category: "people", mood: "가까운 사람 때문에 자꾸 지치고 상처받을 때", note: '나와 너 사이의 적당한 거리, "바운더리"를 세우는 법을 차분하게 알려줘요.', keywords: ["갈등", "상처", "배신", "거리두기", "서운함", "지침", "가족"], emoji: "🪢" },
    { id: "need-to-be-lonely", title: "가끔은 격하게 외로울 필요가 있다", author: "김정운", category: "people", mood: "사람들 속에 있어도 혼자인 것 같을 때", note: "외로움을 피할 대상이 아니라 나를 만나는 시간으로 바꿔 보자는 유쾌한 제안이에요.", keywords: ["외로움", "혼자", "쓸쓸함", "고독", "소외감"], emoji: "🏝️" },
    // ❤️ 사랑
    { id: "essays-in-love", title: "왜 나는 너를 사랑하는가", author: "알랭 드 보통", category: "love", mood: "사랑의 시작과 흔들림, 이별까지 마음이 복잡할 때", note: "사랑에 빠지고 아파하는 우리의 마음을 가장 섬세하고 지적인 언어로 어루만져 줘요.", keywords: ["설렘", "혼란", "이별", "집착", "연애"], emoji: "❤️" },
    { id: "art-of-loving", title: "사랑의 기술", author: "에리히 프롬", category: "love", mood: "나를 잃지 않으면서 건강하게 사랑하고 싶을 때", note: "사랑은 감정에만 머무는 게 아니라 나를 먼저 돌보는 단단한 힘에서 시작된다고 말해줘요.", keywords: ["집착", "불안", "의존", "연애", "자존감"], emoji: "💌" },
    { id: "moments-of-love", title: "모든 순간이 너였다", author: "하태완", category: "love", mood: "지친 연애나 짝사랑 끝에 따뜻한 위로가 필요할 때", note: "반짝이던 순간과 아팠던 마음을 다정하게 토닥여 주는 에세이예요.", keywords: ["짝사랑", "그리움", "이별", "위로", "설렘"], emoji: "🌸" },
    { id: "course-of-love", title: "낭만적 연애와 그 후의 일상", author: "알랭 드 보통", category: "love", mood: "오래된 관계가 예전 같지 않아 서운할 때", note: "설렘이 지나간 뒤의 사랑을 솔직하게 들여다봐요. 다툼도 사랑의 일부라고 알려줘요.", keywords: ["권태", "서운함", "다툼", "결혼", "연애", "실망"], emoji: "🏡" },
    { id: "life-of-love", title: "사랑의 생애", author: "이승우", category: "love", mood: "사랑 앞에서 내 마음을 나도 모르겠을 때", note: "사랑이 사람에게 들어와 머물다 가는 과정을 깊이 있게 그린 소설. 복잡한 마음이 정리돼요.", keywords: ["혼란", "짝사랑", "질투", "설렘", "그리움"], emoji: "🫧" },
    { id: "unbearable-lightness", title: "참을 수 없는 존재의 가벼움", author: "밀란 쿤데라", category: "love", mood: '이별 뒤에 "그때 다른 선택을 했다면" 하고 맴돌 때', note: "사랑과 선택, 무거움과 가벼움을 묻는 소설. 아픈 마음을 조금 멀리서 바라보게 해줘요.", keywords: ["이별", "후회", "미련", "선택", "그리움"], emoji: "🎈" },

    { id: "tteokbokki", title: "죽고 싶지만 떡볶이는 먹고 싶어", author: "백세희", category: "future", mood: "이유 없이 불안하고 마음이 가라앉을 때", note: '가벼운 우울과 불안을 솔직하게 들여다본 상담 기록. "나만 그런 게 아니구나" 싶어져요.', keywords: ["우울", "불안", "무기력", "공허", "자기혐오"], emoji: "🍢" },
    { id: "namiya", title: "나미야 잡화점의 기적", author: "히가시노 게이고", category: "future", mood: "어떤 선택을 해야 할지 막막할 때", note: "고민 편지에 답장을 해주는 잡화점 이야기. 내 고민에도 답이 올 것 같은 기분이 들어요.", keywords: ["막막함", "선택", "진로", "고민", "희망"], emoji: "✉️" },

      err_session_expired: "로그인이 만료됐어요. 다시 로그인한 뒤 눌러 주세요.",
      err_invalid_json: "답을 제대로 받지 못했어요. 한 번 더 눌러 주세요.",
      err_refused: "이 문장에는 답하기 어려워요. 표현을 바꿔 다시 적어 주세요.",
      err_other: "연결이 잠시 끊겼어요. 다시 눌러 주세요."
    },
    en: {
      title: "Maeum Bubble Books",
      sub: "Three books picked for how you feel today",
      tabRule: "Find by feeling words",
      tabAi: "Ask AI",
      ask: "Tell us how you feel in one sentence",
      phRule: "e.g. 발표 앞두고 불안해",
      phAi: "e.g. I'm not anxious, just feeling empty",
      submit: "Get books",
      hintRule: 'This tab understands Korean sentences only. Use "Ask AI" for English.',
      hintAi: "No feeling words needed. The first time, you'll be asked to allow Claude.",
      tryThis: "Try",
      moodPre: "You seem to be feeling ",
      moodPost: "",
      unknown: "We don't know that word yet. Is one of these close?",
      howAbout: "How about these books?",
      thinking: "Reading how you feel…",
      noEmotion: "We couldn't tell how you feel. Tell us a little more.",
      noAi: "AI isn't available here. Open this page while signed in to claude.ai.",
      goRule: "Find by feeling words",
      err_not_granted: `Claude access was not allowed, so AI can't be used. "Find by feeling words" still works.`,
      err_sampling_disabled: 'AI is not available for this account. Please use "Find by feeling words".',
      err_rate_limited: "Please wait a moment and try again.",
      err_session_expired: "Your sign-in expired. Sign in again and try once more.",
      err_invalid_json: "We didn't get a proper answer. Please try again.",
      err_refused: "We can't answer that sentence. Try putting it differently.",
      err_other: "The connection dropped. Please try again."
    }
  };
  var EMO_EN = {
    불안: "anxiety",
    걱정: "worry",
    두려움: "fear",
    지침: "exhaustion",
    번아웃: "burnout",
    무기력: "lethargy",
    우울: "depression",
    슬픔: "sadness",
    외로움: "loneliness",
    상처: "hurt",
    화남: "anger",
    이별: "breakup",
    그리움: "longing",
    짝사랑: "unrequited love",
    설렘: "excitement",
    질투: "jealousy",
    후회: "regret",
    막막함: "feeling lost",
    답답함: "frustration",
    압박: "pressure",
    비교: "comparison",
    "자존감 낮음": "low self-esteem",
    공허: "emptiness",
    "생각 많음": "overthinking",
    불면: "sleeplessness"
  };
  var NINE = ["불안", "지침", "외로움", "이별", "생각 많음", "압박", "무기력", "후회", "상처"];
  var EXAMPLES_KO = ["발표 앞두고 불안해", "요즘 지치고 외로워", "불안한 건 아닌데 마음이 허해", "서러워서 눈물 나"];
  var EXAMPLES_EN = ["Nervous before my presentation", "Tired and lonely lately", "Not anxious, just empty", "So upset I could cry"];
  var lang = "ko";
  try {
    if (localStorage.getItem("mb-lang") === "en") lang = "en";
  } catch {
  }
  var t = (k) => I18N[lang][k];
  var emo = (name) => lang === "en" ? EMO_EN[name] ?? name : name;
  var $ = (s) => document.querySelector(s);
  var esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]);
  var cardsHTML = (items) => '<ol class="books">' + items.map(
    ({ book, why }) => `<li><span class="em" aria-hidden="true">${book.emoji}</span>
      <div class="bk"><div class="t">『${esc(book.title)}』</div><div class="a">${esc(book.author)}</div>
      <div class="w">${esc(why)}</div></div></li>`
  ).join("") + "</ol>";
  var chipsHTML = (items) => items.map((c) => `<button type="button" class="chip" data-q="${esc(c.q)}">${esc(c.label)}</button>`).join("");
  var moodHTML = (names) => `<p class="mood">${esc(t("moodPre"))}<b>${names}</b>${esc(t("moodPost"))}</p>`;
  var defaults = () => DEFAULT_BOOK_IDS.map((id) => BOOKS.find((b) => b.id === id));
  var lastRule = "";
  function ruleRespond(raw) {
    const input = raw.trim();
    if (!input) return;
    lastRule = input;
    const found = findEmotions(input);
    const out = $("#out-rule");
    if (found.length) {
      const books = recommendByKeyword(found.map((f) => f.keyword).join(" "), 3).recommendations.map((r) => ({
        book: r.book,
        why: r.book.note
      }));
      out.innerHTML = moodHTML(found.map((f) => esc(emo(f.emotion))).join(", ")) + cardsHTML(books);
    } else {
      out.innerHTML = `<div class="soft"><p>${esc(t("unknown"))}</p><div class="chips">${chipsHTML(NINE.map((n) => ({ label: emo(n), q: n })))}</div></div><p class="mood">${esc(t("howAbout"))}</p>` + cardsHTML(defaults().map((book) => ({ book, why: book.note })));
    }
  }
  var samplePromise = null;
  function getSample() {
    const w = window;
    if (!samplePromise) samplePromise = (w.claude ? w.claude.use("sample") : Promise.resolve(null)).catch(() => null);
    return samplePromise;
  }
  var aiOff = false;
  var CATALOG = BOOKS.map(
    (b) => `${b.id} | 『${b.title}』 ${b.author} | 이런 마음일 때: ${b.mood} | 키워드: ${b.keywords.join(", ")}`
  ).join("\n");
  function buildPrompt(input) {
    const out = lang === "en" ? "emotion, secondary, why, read 는 모두 자연스러운 영어로 쓴다(emotion은 1~3단어 소문자)." : "emotion은 짧은 한국어 명사(1~6자), why와 read는 한국어 해요체로 쓴다.";
    return `너는 독서 큐레이터다. 사용자가 지금 마음을 한 문장으로 적었다(한국어 또는 영어). 문장 전체의 뜻을 읽고 감정을 판단한 뒤, 아래 책 목록에서만 책 3권을 골라라.

규칙:
- ${out}
- emotion: 가장 강한 감정 하나. secondary: 함께 느껴지는 감정 최대 2개, 없으면 빈 배열.
- 부정 표현("안 ~해", "~지 않아", "~한 건 아닌데", "not ~")이 붙은 감정은 제외한다.
- books: 반드시 아래 목록의 id로만, 서로 다른 책 3권. 목록에 없는 책은 고르지 않는다.
- why: 사용자의 문장을 직접 반영한 한 문장(60자/100 characters 이내). 책 줄거리를 지어내지 말고 감정과의 연결만 말한다.
- read: 사용자의 마음을 다정하게 짚어 주는 한 문장.
- 감정 표현이 전혀 없으면 emotion을 null, books를 빈 배열로 한다.

책 목록:
${CATALOG}

JSON 하나만 답한다:
{"emotion":"감정 또는 null","secondary":["감정"],"read":"한 문장","books":[{"id":"책 id","why":"이유"}]}

사용자 문장: """${input.slice(0, 300)}"""`;
  }
  var STOP_CODES = ["not_granted", "sampling_disabled", "not_declared", "capability_disabled", "capability_removed"];
  var errText = (code) => {
    const k = `err_${code}`;
    return k in I18N.ko ? t(k) : t("err_other");
  };
  var strList = (v, n) => (Array.isArray(v) ? v : []).filter((x) => typeof x === "string" && x.trim() !== "").slice(0, n);
  var goRuleHTML = () => `<div class="chips"><button type="button" class="chip" data-go="rule">${esc(t("goRule"))}</button></div>`;
  async function aiRespond(raw) {
    const input = raw.trim();
    if (!input || aiOff) return;
    const out = $("#out-ai");
    const btn = $("#b-ai");
    out.innerHTML = `<p class="thinking">${esc(t("thinking"))}</p>`;
    btn.disabled = true;
    const sample = await getSample();
    if (!sample) {
      out.innerHTML = `<div class="soft"><p>${esc(t("noAi"))}</p>${goRuleHTML()}</div>`;
      btn.disabled = false;
      return;
    }
    try {
      const res = await sample.json(buildPrompt(input), { modelTier: "quick" });
      const emotion = typeof res?.emotion === "string" && res.emotion.trim() && res.emotion.trim() !== "null" ? res.emotion.trim().slice(0, 24) : null;
      const secondary = strList(res?.secondary, 2).filter((s) => s !== emotion);
      const read = typeof res?.read === "string" ? res.read : "";
      if (!emotion) {
        out.innerHTML = `<div class="soft"><p>${esc(t("noEmotion"))}</p></div><p class="mood">${esc(t("howAbout"))}</p>` + cardsHTML(defaults().map((book) => ({ book, why: book.note })));
      } else {
        const picked = [];
        for (const b of Array.isArray(res?.books) ? res.books : []) {
          const item = b ?? {};
          const book = BOOKS.find((x) => x.id === String(item.id ?? "").trim());
          if (book && !picked.some((p) => p.book.id === book.id) && picked.length < 3)
            picked.push({ book, why: String(item.why ?? "").slice(0, 160) || book.note });
        }
        for (const r of recommendByKeyword([emotion, ...secondary].join(" "), 6).recommendations) {
          if (picked.length < 3 && !picked.some((p) => p.book.id === r.book.id)) picked.push({ book: r.book, why: r.book.note });
        }
        out.innerHTML = moodHTML(esc(emotion) + (secondary.length ? ", " + secondary.map(esc).join(", ") : "")) + (read ? `<p class="read">${esc(read)}</p>` : "") + cardsHTML(picked);
      }
    } catch (e) {
      const code = e?.code ?? "";
      const stop = STOP_CODES.includes(code);
      out.innerHTML = `<div class="soft"><p>${esc(errText(code))}</p>${stop ? goRuleHTML() : ""}</div>`;
      if (stop) {
        aiOff = true;
        $("#q-ai").disabled = true;
        return;
      }
    }
    btn.disabled = false;
  }
  function applyLang() {
    document.documentElement.lang = lang;
    document.title = t("title");
    document.querySelectorAll("[data-i18n]").forEach((el) => {
      const v = t(el.dataset.i18n);
      el.textContent = v;
      if (el.classList.contains("hint")) el.hidden = !v;
    });
    document.querySelectorAll("[data-i18n-ph]").forEach((el) => {
      el.placeholder = t(el.dataset.i18nPh);
    });
    document.querySelectorAll("[data-lang]").forEach((b) => {
      b.setAttribute("aria-pressed", String(b.dataset.lang === lang));
    });
    $("#chips-rule").innerHTML = `<span class="lbl">${esc(t("tryThis"))}</span>` + chipsHTML(EXAMPLES_KO.map((q) => ({ label: q, q })));
    $("#chips-ai").innerHTML = `<span class="lbl">${esc(t("tryThis"))}</span>` + chipsHTML((lang === "en" ? EXAMPLES_EN : EXAMPLES_KO).map((q) => ({ label: q, q })));
    if (lastRule) ruleRespond(lastRule);
    $("#out-ai").innerHTML = "";
  }
  document.querySelectorAll("[data-lang]").forEach(
    (b) => b.addEventListener("click", () => {
      lang = b.dataset.lang === "en" ? "en" : "ko";
      try {
        localStorage.setItem("mb-lang", lang);
      } catch {
      }
      applyLang();
    })
  );
  for (const [form, q, count, fn] of [
    ["#f-rule", "#q-rule", "#c-rule", ruleRespond],
    ["#f-ai", "#q-ai", "#c-ai", aiRespond]
  ]) {
    const ta = $(q);
    ta.addEventListener("input", () => $(count).textContent = `${ta.value.length}/300`);
    ta.addEventListener("keydown", (e) => {
      if (e.key === "Enter" && !e.shiftKey && !e.isComposing) {
        e.preventDefault();
        $(form).requestSubmit();
      }
    });
    $(form).addEventListener("submit", (e) => {
      e.preventDefault();
      if (fn === aiRespond && $("#b-ai").disabled) return;
      fn(ta.value);
    });
  }
  function fillAndRun(panel, text) {
    const ta = $(`#q-${panel}`);
    ta.value = text;
    $(`#c-${panel}`).textContent = `${text.length}/300`;
    if (panel === "rule") ruleRespond(text);
    else if (!$("#b-ai").disabled) aiRespond(text);
  }
  for (const panel of ["rule", "ai"]) {
    $(`#p-${panel}`).addEventListener("click", (e) => {
      const el = e.target;
      if (el.closest("button[data-go]")) {
        location.hash = "rule";
        show("rule");
        return;
      }
      const b = el.closest("button[data-q]");
      if (b) fillAndRun(panel, b.dataset.q ?? "");
    });
  }
  var TABS = {
    rule: [$("#t-rule"), $("#p-rule")],
    ai: [$("#t-ai"), $("#p-ai")]
  };
  function show(name) {
    if (!TABS[name]) name = "rule";
    for (const [k, [tab, p]] of Object.entries(TABS)) {
      const on = k === name;
      tab.setAttribute("aria-selected", String(on));
      tab.tabIndex = on ? 0 : -1;
      p.hidden = !on;
    }
  }
  for (const k of Object.keys(TABS)) {
    TABS[k][0].addEventListener("click", () => {
      location.hash = k;
      show(k);
    });
  }
  $("[role=tablist]").addEventListener("keydown", (e) => {
    if (e.key !== "ArrowRight" && e.key !== "ArrowLeft") return;
    const next = TABS.rule[0].getAttribute("aria-selected") === "true" ? "ai" : "rule";
    location.hash = next;
    show(next);
    TABS[next][0].focus();
  });
  addEventListener("hashchange", () => show(location.hash.slice(1)));
  show(location.hash.slice(1));
  applyLang();
  fillAndRun("rule", EXAMPLES_KO[0]);
})();

</script>
