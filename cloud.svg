<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 150">
  <!-- 마음버블서점 구름 로고: 직접 그린 그림이라 저작권 걱정이 없어요 -->
  <defs>
    <filter id="soft" x="-25%" y="-25%" width="150%" height="150%">
      <feGaussianBlur stdDeviation="3.2"/>
    </filter>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="7"/>
    </filter>
    <radialGradient id="puff" cx="45%" cy="28%" r="85%">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset=".55" stop-color="#f4f6fa"/>
      <stop offset="1" stop-color="#d5dbe6"/>
    </radialGradient>
    <linearGradient id="base" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f3f5f9"/>
      <stop offset="1" stop-color="#cfd6e2"/>
    </linearGradient>
  </defs>
  <!-- 아래쪽 은은한 그림자 -->
  <ellipse cx="100" cy="122" rx="66" ry="9" fill="#9fb3c9" opacity=".25" filter="url(#glow)"/>
  <!-- 몽글몽글한 구름 덩어리 -->
  <g filter="url(#soft)">
    <ellipse cx="100" cy="102" rx="74" ry="22" fill="url(#base)"/>
    <circle cx="48" cy="92" r="26" fill="url(#puff)"/>
    <circle cx="76" cy="72" r="32" fill="url(#puff)"/>
    <circle cx="116" cy="58" r="36" fill="url(#puff)"/>
    <circle cx="150" cy="78" r="30" fill="url(#puff)"/>
    <circle cx="166" cy="98" r="20" fill="url(#puff)"/>
    <circle cx="96" cy="96" r="30" fill="url(#puff)"/>
    <circle cx="130" cy="98" r="26" fill="url(#puff)"/>
  </g>
  <!-- 햇빛 받은 윗부분 하이라이트 -->
  <g fill="#ffffff" filter="url(#glow)" opacity=".9">
    <circle cx="70" cy="64" r="14"/>
    <circle cx="110" cy="48" r="17"/>
    <circle cx="146" cy="70" r="12"/>
  </g>
</svg>
