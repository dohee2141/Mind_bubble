<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>마음버블서점 관리자</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gowun+Dodum&family=Noto+Sans+KR:wght@400;500;700&display=swap">
<style>
:root{
  --bg:#fdf8f5; --surface:#ffffff; --ink:#3a302d; --ink2:#5e524e; --muted:#8a7d78; --line:#f0e4de; --grid:#f3ebe7;
  --accent:#d9718f; --accent-ink:#ffffff; --accent-soft:#fbe6ec; --ai:#8c78c9; --ai-soft:#efeafa;
  --s1:#d9718f; --s2:#8c78c9; --bar:#d9718f; --danger:#b4423c; --danger-soft:#fbe9e7; --ok:#3f7d55;
  --display:"Gowun Dodum","Noto Sans KR",system-ui,sans-serif;
  --sans:"Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  --r:16px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#1e1a1a; --surface:#292323; --ink:#f2e9e6; --ink2:#d8ccc8; --muted:#b4a6a1; --line:#3b3231; --grid:#342c2b;
  --accent:#ee9ab2; --accent-ink:#2a1a1f; --accent-soft:#45282f; --ai:#b9a8ec; --ai-soft:#2f2a40;
  --s1:#d96a8c; --s2:#8c7ce6; --bar:#d96a8c; --danger:#f08a80; --danger-soft:#3e2523; --ok:#8fcfa5; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#1e1a1a; --surface:#292323; --ink:#f2e9e6; --ink2:#d8ccc8; --muted:#b4a6a1; --line:#3b3231; --grid:#342c2b;
  --accent:#ee9ab2; --accent-ink:#2a1a1f; --accent-soft:#45282f; --ai:#b9a8ec; --ai-soft:#2f2a40;
  --s1:#d96a8c; --s2:#8c7ce6; --bar:#d96a8c; --danger:#f08a80; --danger-soft:#3e2523; --ok:#8fcfa5; color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:14px;line-height:1.6;padding:28px 16px 56px}
main{max-width:980px;margin:0 auto;display:flex;flex-direction:column;gap:20px}
h1{font-family:var(--display);font-weight:400;font-size:1.5rem;margin:0}
h2{font-family:var(--display);font-weight:400;font-size:1.1rem;margin:0}
button,input,select,textarea{font:inherit;color:inherit}
.btn{border:0;border-radius:999px;padding:7px 16px;cursor:pointer;background:var(--accent);color:var(--accent-ink);font-weight:500}
.btn.ghost{background:transparent;border:1px solid var(--line);color:var(--ink)}
.btn.danger{background:var(--danger-soft);color:var(--danger)}
.btn:disabled{opacity:.5;cursor:default}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:12px;min-width:0}
.muted{color:var(--muted)}
.small{font-size:.82rem}
input[type=text],input[type=email],input[type=password],input[type=number],input[type=url],select,textarea{
  width:100%;border:1px solid var(--line);border-radius:10px;background:var(--bg);padding:8px 10px}
textarea{resize:vertical;min-height:64px}
label.f{display:flex;flex-direction:column;gap:4px;font-size:.86rem;color:var(--ink2)}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.spread{justify-content:space-between}
.msg{margin:0;font-size:.86rem}
.msg.err{color:var(--danger)}
.msg.ok{color:var(--ok)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

#login{max-width:380px;margin:8vh auto 0}
#app{display:flex;flex-direction:column;gap:20px}
#app[hidden],#login[hidden],#denied[hidden],form[hidden]{display:none}
header.top{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
nav.tabs{display:flex;gap:4px;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:4px;flex-wrap:wrap}
nav.tabs button{border:0;background:transparent;color:var(--muted);padding:6px 14px;border-radius:999px;cursor:pointer;font-weight:500}
nav.tabs button[aria-selected=true]{background:var(--accent-soft);color:var(--accent)}
section[hidden]{display:none!important}
section.view{display:flex;flex-direction:column;gap:16px}

.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px}
.kpi .v{font-family:var(--display);font-size:1.9rem;line-height:1.1;font-variant-numeric:tabular-nums}
.kpi .l{color:var(--ink2);font-size:.86rem}
.kpi .d{color:var(--muted);font-size:.8rem}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
@media (max-width:720px){.grid2{grid-template-columns:1fr}}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:999px;padding:3px;background:var(--surface)}
.seg button{border:0;background:transparent;color:var(--muted);padding:4px 12px;border-radius:999px;cursor:pointer}
.seg button[aria-pressed=true]{background:var(--accent-soft);color:var(--accent);font-weight:500}

.legend{display:flex;gap:14px;font-size:.84rem;color:var(--ink2)}
.legend i{display:inline-block;width:14px;height:3px;border-radius:2px;vertical-align:middle;margin-right:6px}
.chart{position:relative}
.chart svg{display:block;width:100%;height:auto;overflow:visible}
.chart .axis{fill:var(--muted);font-size:11px}
.chart .gridline{stroke:var(--grid);stroke-width:1}
.tip{position:absolute;pointer-events:none;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:8px 10px;font-size:.82rem;box-shadow:0 4px 14px rgba(0,0,0,.12);white-space:nowrap;transform:translate(-50%,-110%)}
.tip b{font-weight:500}
.tip .k{display:inline-block;width:10px;height:3px;border-radius:2px;vertical-align:middle;margin-right:6px}

.bars{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.bars li{display:grid;grid-template-columns:minmax(0,9.5em) 1fr 3em;gap:10px;align-items:center}
.bars .n{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--ink)}
.bars .t{height:12px;background:var(--grid);border-radius:4px;overflow:hidden}
.bars .b{height:100%;background:var(--bar);border-radius:0 4px 4px 0}
.bars .c{text-align:right;font-variant-numeric:tabular-nums;color:var(--ink2)}
.empty{color:var(--muted);font-size:.88rem;margin:0}

.tbl{width:100%;border-collapse:collapse;font-size:.86rem}
.tbl th{text-align:left;font-weight:500;color:var(--muted);border-bottom:1px solid var(--line);padding:6px 8px;white-space:nowrap}
.tbl td{border-bottom:1px solid var(--line);padding:8px;vertical-align:top}
.tbl tr:last-child td{border-bottom:0}
.scroll{overflow-x:auto}
.tag{display:inline-block;border-radius:999px;padding:0 8px;font-size:.76rem;background:var(--accent-soft);color:var(--accent)}
.tag.ai{background:var(--ai-soft);color:var(--ai)}
.tag.off{background:var(--grid);color:var(--muted)}
.cover{width:36px;height:52px;object-fit:cover;border-radius:3px;background:var(--line)}
.stars{color:var(--accent);letter-spacing:1px}

dialog{border:1px solid var(--line);border-radius:var(--r);background:var(--surface);color:var(--ink);padding:0;width:min(560px,calc(100vw - 32px))}
dialog::backdrop{background:rgba(0,0,0,.35)}
dialog form{padding:18px;display:flex;flex-direction:column;gap:10px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media (max-width:520px){.two{grid-template-columns:1fr}}
.switch{display:flex;gap:8px;align-items:center;cursor:pointer}
</style>
</head>
<body>
<main>
  <!-- 로그인 -->
  <section id="login" class="card" hidden>
    <h1>관리자 로그인</h1>
    <p id="login-note" class="muted small"></p>
    <form id="login-form" class="row" style="flex-direction:column;align-items:stretch;gap:10px">
      <label class="f">이메일<input type="email" id="login-email" autocomplete="username" required></label>
      <label class="f">비밀번호<input type="password" id="login-pw" autocomplete="current-password" required></label>
      <button class="btn" type="submit">로그인</button>
      <p class="msg err" id="login-msg" aria-live="polite"></p>
    </form>
  </section>

  <!-- 권한 없음 -->
  <section id="denied" class="card" hidden>
    <h1>관리자 권한이 없어요</h1>
    <p class="muted">이 계정은 관리자로 등록되어 있지 않아요.</p>
    <div><button class="btn ghost" data-logout>로그아웃</button></div>
  </section>

  <!-- 관리자 화면 -->
  <div id="app" hidden>
    <header class="top">
      <div>
        <h1>마음버블서점 관리자</h1>
        <p class="muted small" id="who"></p>
      </div>
      <div class="row">
        <a class="btn ghost" href="./" target="_blank" rel="noopener" style="text-decoration:none">사이트 열기</a>
        <button class="btn ghost" data-logout>로그아웃</button>
      </div>
    </header>

    <nav class="tabs" role="tablist" aria-label="관리 메뉴">
      <button role="tab" data-tab="dash" aria-selected="true">대시보드</button>
      <button role="tab" data-tab="books" aria-selected="false">책 관리</button>
      <button role="tab" data-tab="fb" aria-selected="false">피드백</button>
      <button role="tab" data-tab="set" aria-selected="false">설정</button>
    </nav>

    <!-- 대시보드 -->
    <section class="view" id="v-dash" role="tabpanel">
      <div class="row spread">
        <div class="seg" role="group" aria-label="기간">
          <button data-days="7" aria-pressed="false">7일</button>
          <button data-days="30" aria-pressed="true">30일</button>
          <button data-days="90" aria-pressed="false">90일</button>
        </div>
        <button class="btn ghost" id="refresh">새로고침</button>
      </div>
      <div class="kpis" id="kpis"></div>
      <div class="card">
        <div class="row spread">
          <h2>날짜별 방문·검색</h2>
          <div class="legend"><span><i style="background:var(--s1)"></i>방문</span><span><i style="background:var(--s2)"></i>검색</span></div>
        </div>
        <div class="chart" id="chart"></div>
        <details class="small"><summary class="muted">표로 보기</summary><div class="scroll" id="chart-table"></div></details>
      </div>
      <div class="grid2">
        <div class="card"><h2>많이 나온 감정</h2><ul class="bars" id="top-emo"></ul></div>
        <div class="card"><h2>많이 추천된 책</h2><ul class="bars" id="top-books"></ul></div>
      </div>
      <div class="card">
        <h2>최근 검색</h2>
        <div class="scroll"><table class="tbl" id="recent"></table></div>
      </div>
    </section>

    <!-- 책 관리 -->
    <section class="view" id="v-books" role="tabpanel" hidden>
      <div class="row spread">
        <p class="muted small" id="books-count"></p>
        <button class="btn" id="book-new">새 책 추가</button>
      </div>
      <div class="card"><div class="scroll"><table class="tbl" id="books-tbl"></table></div></div>
    </section>

    <!-- 피드백 -->
    <section class="view" id="v-fb" role="tabpanel" hidden>
      <p class="muted small" id="fb-count"></p>
      <div class="card"><div class="scroll"><table class="tbl" id="fb-tbl"></table></div></div>
    </section>

    <!-- 설정 -->
    <section class="view" id="v-set" role="tabpanel" hidden>
      <form class="card" id="set-form">
        <h2>AI 추천</h2>
        <label class="switch"><input type="checkbox" id="set-ai"> 공개 사이트에서 "AI에게 물어보기" 사용</label>
        <div class="two">
          <label class="f">모델
            <select id="set-model">
              <option value="claude-opus-5-5">Claude Opus 5.5 (기본)</option>
              <option value="claude-sonnet-5-5">Claude Sonnet 5.5</option>
              <option value="claude-haiku-5-5">Claude Haiku 5.5 (가장 저렴)</option>
            </select>
          </label>
          <label class="f">하루 전체 한도 (회)<input type="number" id="set-daily" min="0" max="100000"></label>
          <label class="f">한 사람(IP)당 1시간 한도 (회)<input type="number" id="set-hourly" min="1" max="1000"></label>
        </div>
        <div class="row"><button class="btn" type="submit">저장</button><p class="msg" id="set-msg" aria-live="polite"></p></div>
      </form>
      <form class="card" id="key-form" autocomplete="off">
        <h2>Claude API 키</h2>
        <p class="small muted">저장한 키는 다시 볼 수 없고, AI 추천 서버만 사용해요. 화면에는 끝 4자리만 보여요.</p>
        <p id="key-status" class="small"></p>
        <label class="f">새 키<input type="password" id="key-input" placeholder="sk-ant-..." autocomplete="new-password"></label>
        <div class="row">
          <button class="btn" type="submit">키 저장</button>
          <button class="btn danger" type="button" id="key-clear">키 삭제</button>
          <p class="msg" id="key-msg" aria-live="polite"></p>
        </div>
      </form>
    </section>
  </div>
</main>

<dialog id="book-dlg">
  <form id="book-form" method="dialog">
    <h2 id="book-dlg-title">책 편집</h2>
    <div class="two">
      <label class="f">ID (영문 소문자·숫자·-)<input type="text" id="b-id" required pattern="[a-z0-9-]{1,60}"></label>
      <label class="f">분류
        <select id="b-category">
          <option value="work">💼 일 &amp; 학업</option>
          <option value="people">👥 인간관계</option>
          <option value="love">❤️ 사랑</option>
          <option value="future">🌫️ 미래 &amp; 불안</option>
          <option value="burnout">🔋 피로 &amp; 번아웃</option>
          <option value="thoughts">💭 사소한 생각</option>
        </select>
      </label>
      <label class="f">제목<input type="text" id="b-title" required></label>
      <label class="f">저자<input type="text" id="b-author"></label>
    </div>
    <label class="f">이런 마음일 때<input type="text" id="b-mood"></label>
    <label class="f">추천 한마디<textarea id="b-note"></textarea></label>
    <label class="f">감정 키워드 (쉼표로 구분)<input type="text" id="b-keywords"></label>
    <div class="two">
      <label class="f">이모지<input type="text" id="b-emoji" maxlength="8"></label>
      <label class="f">정렬 순서 (작을수록 앞)<input type="number" id="b-sort"></label>
    </div>
    <label class="f">표지 이미지 주소 (비우면 covers/ID.jpg)<input type="url" id="b-cover"></label>
    <label class="switch"><input type="checkbox" id="b-active"> 사이트에 보이기</label>
    <p class="msg err" id="book-msg" aria-live="polite"></p>
    <div class="row spread">
      <button class="btn danger" type="button" id="book-del">삭제</button>
      <div class="row"><button class="btn ghost" type="button" id="book-cancel">취소</button><button class="btn" type="button" id="book-save">저장</button></div>
    </div>
  </form>
</dialog>

<script src="mb-config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script>
"use strict";
(() => {
  const $ = (s) => document.querySelector(s);
  const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c]);
  const fmt = new Intl.NumberFormat("ko-KR");
  const C = window.MB_CONFIG || {};
  const show = (id) => ["#login", "#denied", "#app"].forEach((s) => ($(s).hidden = s !== id));

  if (!C.supabaseUrl || !C.supabaseKey || !window.supabase) {
    show("#login");
    $("#login-note").textContent = "mb-config.js 에 Supabase 주소와 공개 키를 먼저 넣어 주세요.";
    $("#login-form").hidden = true;
    return;
  }
  const sb = window.supabase.createClient(C.supabaseUrl, C.supabaseKey);
  let BOOKS = [];
  let days = 30;

  // ───── 로그인 ─────
  async function enter() {
    const { data: { session } } = await sb.auth.getSession();
    if (!session) { show("#login"); return; }
    let { data: isAdmin } = await sb.rpc("is_admin");
    if (!isAdmin) ({ data: isAdmin } = await sb.rpc("claim_admin"));
    if (!isAdmin) { show("#denied"); return; }
    $("#who").textContent = session.user.email + " 로 로그인됨";
    show("#app");
    await loadBooks();
    loadDash();
  }
  $("#login-form").addEventListener("submit", async (e) => {
    e.preventDefault();
    $("#login-msg").textContent = "";
    const { error } = await sb.auth.signInWithPassword({ email: $("#login-email").value.trim(), password: $("#login-pw").value });
    if (error) { $("#login-msg").textContent = "이메일이나 비밀번호가 맞지 않아요."; return; }
    $("#login-pw").value = "";
    enter();
  });
  document.querySelectorAll("[data-logout]").forEach((b) => b.addEventListener("click", async () => {
    await sb.auth.signOut();
    show("#login");
  }));

  // ───── 탭 ─────
  const loaders = { dash: () => loadDash(), books: () => renderBooks(), fb: () => loadFeedback(), set: () => loadSettings() };
  document.querySelectorAll("[data-tab]").forEach((b) => b.addEventListener("click", () => {
    document.querySelectorAll("[data-tab]").forEach((x) => x.setAttribute("aria-selected", String(x === b)));
    document.querySelectorAll("section.view").forEach((v) => (v.hidden = v.id !== "v-" + b.dataset.tab));
    loaders[b.dataset.tab]();
  }));

  // ───── 대시보드 ─────
  document.querySelectorAll("[data-days]").forEach((b) => b.addEventListener("click", () => {
    days = Number(b.dataset.days);
    document.querySelectorAll("[data-days]").forEach((x) => x.setAttribute("aria-pressed", String(x === b)));
    loadDash();
  }));
  $("#refresh").addEventListener("click", () => loadDash());

  const dayKey = (d) => {
    const x = new Date(d);
    return `${x.getFullYear()}-${String(x.getMonth() + 1).padStart(2, "0")}-${String(x.getDate()).padStart(2, "0")}`;
  };

  async function fetchAll(table, cols, since) {
    const out = [];
    for (let from = 0; from < 50000; from += 1000) {
      const { data, error } = await sb.from(table).select(cols).gte("created_at", since).order("created_at", { ascending: false }).range(from, from + 999);
      if (error) throw error;
      out.push(...data);
      if (data.length < 1000) break;
    }
    return out;
  }

  async function loadDash() {
    const start = new Date();
    start.setHours(0, 0, 0, 0);
    start.setDate(start.getDate() - (days - 1));
    const since = start.toISOString();
    let events, fb, aiDay, settings;
    try {
      [events, fb, aiDay, settings] = await Promise.all([
        fetchAll("events", "created_at,kind,mode,query,emotions,books", since),
        fetchAll("feedback", "created_at,rating", since),
        sb.from("ai_calls").select("id", { count: "exact", head: true }).gte("created_at", new Date(Date.now() - 86400000).toISOString()),
        sb.from("settings").select("ai_daily_limit").eq("id", 1).maybeSingle()
      ]);
    } catch (err) {
      $("#kpis").innerHTML = `<p class="msg err">데이터를 불러오지 못했어요: ${esc(err.message)}</p>`;
      return;
    }
    const visits = events.filter((e) => e.kind === "visit");
    const searches = events.filter((e) => e.kind === "search");
    const ai = searches.filter((e) => e.mode === "ai").length;
    const rated = fb.filter((f) => f.rating);
    const avg = rated.length ? (rated.reduce((s, f) => s + f.rating, 0) / rated.length).toFixed(1) : "–";
    const limit = settings.data?.ai_daily_limit ?? 0;
    $("#kpis").innerHTML = [
      ["방문", fmt.format(visits.length), `최근 ${days}일`],
      ["검색", fmt.format(searches.length), `마음 단어 ${fmt.format(searches.length - ai)} · AI ${fmt.format(ai)}`],
      ["평균 별점", avg, `피드백 ${fmt.format(fb.length)}개`],
      ["AI 호출 (24시간)", fmt.format(aiDay.count ?? 0), `하루 한도 ${fmt.format(limit)}회`]
    ].map(([l, v, d]) => `<div class="card kpi"><span class="l">${l}</span><span class="v">${v}</span><span class="d">${d}</span></div>`).join("");

    // 날짜별
    const keys = [];
    for (let i = 0; i < days; i++) { const d = new Date(start); d.setDate(start.getDate() + i); keys.push(dayKey(d)); }
    const byDay = Object.fromEntries(keys.map((k) => [k, { v: 0, s: 0 }]));
    for (const e of events) { const k = dayKey(e.created_at); if (byDay[k]) byDay[k][e.kind === "visit" ? "v" : "s"]++; }
    drawChart(keys.map((k) => ({ k, v: byDay[k].v, s: byDay[k].s })));

    // 감정·책 순위
    const count = (arrs) => { const m = new Map(); for (const a of arrs) for (const x of a || []) m.set(x, (m.get(x) || 0) + 1); return [...m].sort((a, b) => b[1] - a[1]).slice(0, 10); };
    const title = (id) => { const b = BOOKS.find((x) => x.id === id); return b ? `『${b.title}』` : id; };
    barList("#top-emo", count(searches.map((e) => e.emotions)), (x) => x);
    barList("#top-books", count(searches.map((e) => e.books)), title);

    // 최근 검색
    const recent = searches.slice(0, 30);
    $("#recent").innerHTML = recent.length
      ? `<thead><tr><th>시간</th><th>방식</th><th>입력한 문장</th><th>감정</th><th>추천된 책</th></tr></thead><tbody>` +
        recent.map((e) => `<tr><td class="muted">${esc(new Date(e.created_at).toLocaleString("ko-KR", { month: "numeric", day: "numeric", hour: "2-digit", minute: "2-digit" }))}</td>
          <td><span class="tag${e.mode === "ai" ? " ai" : ""}">${e.mode === "ai" ? "AI" : "마음 단어"}</span></td>
          <td>${esc(e.query)}</td><td>${esc((e.emotions || []).join(", "))}</td>
          <td class="small">${esc((e.books || []).map(title).join(" "))}</td></tr>`).join("") + "</tbody>"
      : `<tbody><tr><td class="empty">아직 검색 기록이 없어요.</td></tr></tbody>`;
  }

  function barList(sel, rows, label) {
    const max = Math.max(1, ...rows.map((r) => r[1]));
    $(sel).innerHTML = rows.length
      ? rows.map(([k, n]) => `<li title="${esc(label(k))}: ${n}회"><span class="n">${esc(label(k))}</span><span class="t"><span class="b" style="width:${(n / max) * 100}%"></span></span><span class="c">${fmt.format(n)}</span></li>`).join("")
      : `<li class="empty">아직 기록이 없어요.</li>`;
  }

  function drawChart(rows) {
    const W = 920, H = 240, L = 36, R = 12, T = 12, B = 26;
    const max = Math.max(4, ...rows.map((r) => Math.max(r.v, r.s)));
    const step = Math.pow(10, Math.floor(Math.log10(max)));
    const top = Math.ceil(max / step) * step;
    const x = (i) => L + (rows.length === 1 ? (W - L - R) / 2 : (i * (W - L - R)) / (rows.length - 1));
    const y = (v) => T + (H - T - B) * (1 - v / top);
    const ticks = [0, top / 2, top];
    const path = (key) => rows.map((r, i) => `${i ? "L" : "M"}${x(i).toFixed(1)},${y(r[key]).toFixed(1)}`).join("");
    const every = Math.ceil(rows.length / 8);
    const short = (k) => k.slice(5).replace("-", "/");
    $("#chart").innerHTML = `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="날짜별 방문과 검색 수">
      ${ticks.map((t) => `<line class="gridline" x1="${L}" x2="${W - R}" y1="${y(t)}" y2="${y(t)}"/><text class="axis" x="${L - 6}" y="${y(t) + 4}" text-anchor="end">${fmt.format(t)}</text>`).join("")}
      ${rows.map((r, i) => (i % every === 0 || i === rows.length - 1) ? `<text class="axis" x="${x(i)}" y="${H - 6}" text-anchor="middle">${short(r.k)}</text>` : "").join("")}
      <path d="${path("v")}" fill="none" stroke="var(--s1)" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
      <path d="${path("s")}" fill="none" stroke="var(--s2)" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
      <line id="cross" x1="0" x2="0" y1="${T}" y2="${H - B}" stroke="var(--muted)" stroke-width="1" stroke-dasharray="3 3" visibility="hidden"/>
      <circle id="dot-v" r="4.5" fill="var(--s1)" stroke="var(--surface)" stroke-width="2" visibility="hidden"/>
      <circle id="dot-s" r="4.5" fill="var(--s2)" stroke="var(--surface)" stroke-width="2" visibility="hidden"/>
      <rect id="hit" x="${L}" y="${T}" width="${W - L - R}" height="${H - T - B}" fill="transparent"/>
    </svg><div class="tip" id="tip" hidden></div>`;
    const svg = $("#chart svg"), tip = $("#tip");
    const hide = () => { ["#cross", "#dot-v", "#dot-s"].forEach((s) => $(s).setAttribute("visibility", "hidden")); tip.hidden = true; };
    $("#hit").addEventListener("pointermove", (ev) => {
      const box = svg.getBoundingClientRect();
      const px = ((ev.clientX - box.left) / box.width) * W;
      const i = Math.max(0, Math.min(rows.length - 1, Math.round(((px - L) / (W - L - R)) * (rows.length - 1))));
      const r = rows[i];
      $("#cross").setAttribute("x1", x(i)); $("#cross").setAttribute("x2", x(i)); $("#cross").setAttribute("visibility", "visible");
      for (const [k, id] of [["v", "#dot-v"], ["s", "#dot-s"]]) { const c = $(id); c.setAttribute("cx", x(i)); c.setAttribute("cy", y(r[k])); c.setAttribute("visibility", "visible"); }
      tip.innerHTML = `<b>${short(r.k)}</b><br><span class="k" style="background:var(--s1)"></span>방문 ${fmt.format(r.v)}<br><span class="k" style="background:var(--s2)"></span>검색 ${fmt.format(r.s)}`;
      tip.style.left = (x(i) / W) * box.width + "px";
      tip.style.top = (y(Math.max(r.v, r.s)) / H) * box.height + "px";
      tip.hidden = false;
    });
    $("#hit").addEventListener("pointerleave", hide);
    $("#chart-table").innerHTML = `<table class="tbl"><thead><tr><th>날짜</th><th>방문</th><th>검색</th></tr></thead><tbody>${rows.slice().reverse().map((r) => `<tr><td>${r.k}</td><td>${r.v}</td><td>${r.s}</td></tr>`).join("")}</tbody></table>`;
  }

  // ───── 책 관리 ─────
  async function loadBooks() {
    const { data, error } = await sb.from("books").select("*").order("sort").order("title");
    if (!error) BOOKS = data;
    return !error;
  }
  const CAT = { work: "일 & 학업", people: "인간관계", love: "사랑", future: "미래 & 불안", burnout: "피로 & 번아웃", thoughts: "사소한 생각" };
  async function renderBooks() {
    await loadBooks();
    $("#books-count").textContent = `전체 ${BOOKS.length}권 · 사이트에 보이는 책 ${BOOKS.filter((b) => b.active).length}권`;
    $("#books-tbl").innerHTML = `<thead><tr><th></th><th>제목</th><th>분류</th><th>키워드</th><th>상태</th><th></th></tr></thead><tbody>` +
      BOOKS.map((b) => `<tr>
        <td><img class="cover" src="${esc(b.cover_url || `covers/${b.id}.jpg`)}" alt="" loading="lazy" onerror="this.style.visibility='hidden'"></td>
        <td><b>${esc(b.title)}</b><br><span class="muted small">${esc(b.author)}</span></td>
        <td class="small">${esc(CAT[b.category] || b.category)}</td>
        <td class="small">${esc((b.keywords || []).join(", "))}</td>
        <td>${b.active ? '<span class="tag">보임</span>' : '<span class="tag off">숨김</span>'}</td>
        <td><button class="btn ghost" data-edit="${esc(b.id)}">편집</button></td></tr>`).join("") + "</tbody>";
  }
  $("#books-tbl").addEventListener("click", (e) => { const b = e.target.closest("[data-edit]"); if (b) openBook(BOOKS.find((x) => x.id === b.dataset.edit)); });
  $("#book-new").addEventListener("click", () => openBook(null));
  let editing = null;
  function openBook(b) {
    editing = b;
    $("#book-dlg-title").textContent = b ? "책 편집" : "새 책 추가";
    $("#b-id").value = b?.id ?? ""; $("#b-id").readOnly = Boolean(b);
    $("#b-category").value = b?.category ?? "work";
    $("#b-title").value = b?.title ?? ""; $("#b-author").value = b?.author ?? "";
    $("#b-mood").value = b?.mood ?? ""; $("#b-note").value = b?.note ?? "";
    $("#b-keywords").value = (b?.keywords ?? []).join(", ");
    $("#b-emoji").value = b?.emoji ?? "📘";
    $("#b-sort").value = b?.sort ?? (Math.max(0, ...BOOKS.map((x) => x.sort)) + 10);
    $("#b-cover").value = b?.cover_url ?? "";
    $("#b-active").checked = b ? b.active : true;
    $("#book-del").hidden = !b;
    $("#book-msg").textContent = "";
    $("#book-dlg").showModal();
  }
  $("#book-cancel").addEventListener("click", () => $("#book-dlg").close());
  $("#book-save").addEventListener("click", async () => {
    const form = $("#book-form");
    if (!form.reportValidity()) return;
    const row = {
      id: $("#b-id").value.trim(), category: $("#b-category").value, title: $("#b-title").value.trim(), author: $("#b-author").value.trim(),
      mood: $("#b-mood").value.trim(), note: $("#b-note").value.trim(),
      keywords: $("#b-keywords").value.split(",").map((s) => s.trim()).filter(Boolean),
      emoji: $("#b-emoji").value.trim() || "📘", sort: Number($("#b-sort").value) || 1000,
      cover_url: $("#b-cover").value.trim() || null, active: $("#b-active").checked, updated_at: new Date().toISOString()
    };
    if (!editing && BOOKS.some((b) => b.id === row.id)) { $("#book-msg").textContent = "같은 ID의 책이 이미 있어요."; return; }
    const { error } = editing ? await sb.from("books").update(row).eq("id", row.id) : await sb.from("books").insert(row);
    if (error) { $("#book-msg").textContent = "저장하지 못했어요: " + error.message; return; }
    $("#book-dlg").close();
    renderBooks();
  });
  $("#book-del").addEventListener("click", async () => {
    if (!editing || !confirm(`『${editing.title}』을(를) 삭제할까요? 되돌릴 수 없어요. 잠시 숨기려면 "사이트에 보이기"를 끄세요.`)) return;
    const { error } = await sb.from("books").delete().eq("id", editing.id);
    if (error) { $("#book-msg").textContent = "삭제하지 못했어요: " + error.message; return; }
    $("#book-dlg").close();
    renderBooks();
  });

  // ───── 피드백 ─────
  async function loadFeedback() {
    const { data, error } = await sb.from("feedback").select("*").order("created_at", { ascending: false }).limit(500);
    if (error) { $("#fb-tbl").innerHTML = `<tbody><tr><td class="msg err">${esc(error.message)}</td></tr></tbody>`; return; }
    $("#fb-count").textContent = `최근 피드백 ${data.length}개`;
    $("#fb-tbl").innerHTML = data.length
      ? `<thead><tr><th>날짜</th><th>별점</th><th>내용</th><th></th></tr></thead><tbody>` + data.map((f) => `<tr>
          <td class="muted small">${esc(new Date(f.created_at).toLocaleString("ko-KR"))}</td>
          <td class="stars" aria-label="${f.rating ?? 0}점">${f.rating ? "★".repeat(f.rating) + '<span class="muted">' + "★".repeat(5 - f.rating) + "</span>" : '<span class="muted small">없음</span>'}</td>
          <td>${esc(f.message || "")}</td>
          <td><button class="btn danger" data-fbdel="${f.id}">삭제</button></td></tr>`).join("") + "</tbody>"
      : `<tbody><tr><td class="empty">아직 피드백이 없어요.</td></tr></tbody>`;
  }
  $("#fb-tbl").addEventListener("click", async (e) => {
    const b = e.target.closest("[data-fbdel]");
    if (!b || !confirm("이 피드백을 삭제할까요? 되돌릴 수 없어요.")) return;
    await sb.from("feedback").delete().eq("id", b.dataset.fbdel);
    loadFeedback();
  });

  // ───── 설정 ─────
  async function loadSettings() {
    const { data } = await sb.from("settings").select("*").eq("id", 1).maybeSingle();
    if (data) {
      $("#set-ai").checked = data.ai_enabled; $("#set-model").value = data.ai_model;
      $("#set-daily").value = data.ai_daily_limit; $("#set-hourly").value = data.ai_hourly_per_ip;
    }
    const { data: st, error } = await sb.rpc("secret_status");
    const k = (st || []).find((s) => s.name === "ANTHROPIC_API_KEY");
    $("#key-status").innerHTML = error ? `<span class="msg err">${esc(error.message)}</span>`
      : k ? `✅ 키가 저장되어 있어요 (<b>${esc(k.hint)}</b>, ${esc(new Date(k.updated_at).toLocaleString("ko-KR"))})`
      : "⚠️ 저장된 키가 없어요. 키를 넣기 전에는 공개 사이트의 AI 탭이 작동하지 않아요.";
  }
  $("#set-form").addEventListener("submit", async (e) => {
    e.preventDefault();
    const { error } = await sb.from("settings").update({
      ai_enabled: $("#set-ai").checked, ai_model: $("#set-model").value,
      ai_daily_limit: Number($("#set-daily").value), ai_hourly_per_ip: Number($("#set-hourly").value), updated_at: new Date().toISOString()
    }).eq("id", 1);
    const m = $("#set-msg");
    m.className = "msg " + (error ? "err" : "ok");
    m.textContent = error ? "저장하지 못했어요: " + error.message : "저장했어요.";
  });
  $("#key-form").addEventListener("submit", async (e) => {
    e.preventDefault();
    const v = $("#key-input").value.trim();
    const m = $("#key-msg");
    if (v.length < 10) { m.className = "msg err"; m.textContent = "키를 확인해 주세요."; return; }
    const { error } = await sb.rpc("set_secret", { p_name: "ANTHROPIC_API_KEY", p_value: v });
    $("#key-input").value = "";
    m.className = "msg " + (error ? "err" : "ok");
    m.textContent = error ? "저장하지 못했어요: " + error.message : "키를 저장했어요.";
    loadSettings();
  });
  $("#key-clear").addEventListener("click", async () => {
    if (!confirm("저장된 API 키를 삭제할까요? 삭제하면 AI 탭이 멈춰요.")) return;
    const { error } = await sb.rpc("clear_secret", { p_name: "ANTHROPIC_API_KEY" });
    const m = $("#key-msg");
    m.className = "msg " + (error ? "err" : "ok");
    m.textContent = error ? "삭제하지 못했어요: " + error.message : "키를 삭제했어요.";
    loadSettings();
  });

  sb.auth.onAuthStateChange((ev) => { if (ev === "SIGNED_OUT") show("#login"); });
  enter();
})();
</script>
</body>
</html>
